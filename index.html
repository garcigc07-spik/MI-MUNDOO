      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      font-weight: bold;
      letter-spacing: 0.5px;

      border-color: #ff0055 !important;
      box-shadow: 0 0 20px #ff0055 !important;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }

      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #ffffff;

      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      cursor: pointer;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;

      text-shadow: 0 0 20px #ff69b4;

      box-shadow: 0 0 35px #ff69b4;
      border: 2px solid #ff69b4;

    function generatePlanetTexture(baseColorHex, detailColorHex, type = 'planet') {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseColorHex;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (type === 'sun') {
        const grad = ctx.createRadialGradient(512, 256, 10, 512, 256, 500);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.2, '#ffcc00');
        grad.addColorStop(0.8, '#ff3300');
        grad.addColorStop(1, '#990000');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        for (let i = 0; i < 80; i++) {
          ctx.fillStyle = detailColorHex;
          ctx.globalAlpha = Math.random() * 0.3;
          ctx.fillRect(0, Math.random() * canvas.height, canvas.width, Math.random() * 40 + 5);
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    function createBadgeSprite(text, colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = colorHex;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(10, 10, 236, 44, 20);
      else ctx.rect(10, 10, 236, 44);
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.font = 'Bold 22px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(text, 128, 38);

      const tex = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(3.5, 0.9, 1);
      return sprite;
    }

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const fontStyle = 'Bold 24px Arial';
      ctx.font = fontStyle;
      const textWidth = ctx.measureText(text).width;
      canvas.width = Math.max(256, Math.ceil(textWidth + 40));
      canvas.height = 64;

      ctx.font = fontStyle;
      ctx.fillStyle = '#ffb6c1';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const tex = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      const aspect = canvas.width / canvas.height;
      sprite.scale.set(1.5 * aspect, 1.5, 1);
      sprite.userData = { isWord: true, text: text };
      return sprite;

      const geo = new THREE.SphereGeometry(data.radio, 64, 64);
      const mat = data.esSol ? new THREE.MeshBasicMaterial({ map: data.textura }) : new THREE.MeshStandardMaterial({ map: data.textura, roughness: 0.4 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData = { index: index, isBody: true };
      group.add(mesh);

      if (data.tieneAnillo) {
        const ringGeo = new THREE.RingGeometry(data.radio + 4, data.radio + 12, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xe6c280, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });

        ring.rotation.x = Math.PI / 2.3;

      interactiveObjects.push(sprite);

        cardGroup.add(badge);
      } else {
        const frameMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 4.0), new THREE.MeshBasicMaterial({ color: 0x00f3ff, side: THREE.DoubleSide }));
        cardGroup.add(frameMesh);

        const videoElem = document.createElement('video');
        videoElem.src = mediaSrc;
        videoElem.loop = true; videoElem.muted = true; videoElem.playsInline = true;
        videoElem.play().catch(() => {});

        const videoMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.0, 3.6), new THREE.MeshBasicMaterial({ map: new THREE.VideoTexture(videoElem), side: THREE.DoubleSide }));
        videoMesh.position.set(0, 0, 0.02);
        videoMesh.userData = { isVideo: true, src: mediaSrc, videoElem: videoElem, docId: docId, planetaIdx: planetaIdx, parentGroup: cardGroup };
        cardGroup.add(videoMesh);
        interactiveObjects.push(videoMesh);
        videoElements3D.push(videoElem);

        const badge = createBadgeSprite('▶ VIDEO', '#00bfff');
        badge.position.set(0, 2.7, 0);
        cardGroup.add(badge);
      }

      const angleOffset = Math.random() * Math.PI * 2;
      const dist = data.radio + 8 + Math.random() * 4;
      const height = (Math.random() - 0.5) * 8;
      cardGroup.position.set(Math.cos(angleOffset) * dist, height, Math.sin(angleOffset) * dist);

      group.add(cardGroup);
      mediaGroupsToOrient.push(cardGroup);
    }

    async function sincronizarFirebase() {
      onSnapshot(collection(db, "media"), (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === "added") {
            const data = change.doc.data();
            agregarMedia3D(data.planetaIdx, data.src, data.esVideo, change.doc.id);
          }
          if (change.type === "removed") {
            const docId = change.doc.id;
            interactiveObjects.forEach(obj => {
              if (obj.userData.docId === docId) {
                const parent = obj.userData.parentGroup;
                if (parent) {
                  scene.remove(parent);
                  planetMeshes[obj.userData.planetaIdx].remove(parent);
                }
                interactiveObjects.splice(interactiveObjects.indexOf(obj), 1);
              }
            });
          }
        });
      });

      onSnapshot(collection(db, "palabras"), (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === "added") {
            const data = change.doc.data();
            agregarPalabra3D(data.planetaIdx, data.texto, change.doc.id);
          }
          if (change.type === "removed") {
            const docId = change.doc.id;
            interactiveObjects.forEach(obj => {
              if (obj.userData.docId === docId) {
                obj.parent.remove(obj);
                interactiveObjects.splice(interactiveObjects.indexOf(obj), 1);
              }
            });
          }
        });
      });
    }

    document.getElementById('input-media').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      const esVideo = file.type.startsWith('video/');

      reader.onload = async function(evt) {
        const dataUrl = evt.target.result;
        try {
          await addDoc(collection(db, "media"), {
            planetaIdx: planetaActualIndex,
            src: dataUrl,
            esVideo: esVideo,
            timestamp: Date.now()
          });
        } catch (err) {
          alert("Error al subir a la nube. Verifica tu conexión.");
        }
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btn-add-word').addEventListener('click', async () => {
      const texto = prompt("Escribe una frase o palabra especial para este planeta:");
      if (texto && texto.trim() !== "") {
        try {
          await addDoc(collection(db, "palabras"), {
            planetaIdx: planetaActualIndex,
            texto: texto.trim(),
            timestamp: Date.now()
          });
        } catch (err) {
          alert("Error al guardar la frase.");
        }
      }
    });

    const btnDelete = document.getElementById('btn-delete-mode');
    btnDelete.addEventListener('click', () => {
      modoEliminar = !modoEliminar;
      if (modoEliminar) {
        btnDelete.classList.add('active-delete');
        btnDelete.innerText = '⚠️ Toca elemento a borrar';
      } else {
        btnDelete.classList.remove('active-delete');
        btnDelete.innerText = '🗑️ Eliminar';
      }
    });

    let planetaActualIndex = 0;
    let navegando = false;

    function enfocarPlaneta(index) {
      navegando = true;
      planetaActualIndex = index;

      wordGroups.forEach((wg, idx) => { wg.visible = (idx === index); });

      const targetGroup = planetMeshes[index];
      const data = sistemaSolarData[index];
      const targetPos = targetGroup.position.clone();
      const offset = new THREE.Vector3(0, data.radio * 1.8, data.radio * 3.8);
      const camTargetPos = targetPos.clone().add(offset);

      new TWEEN.Tween(camera.position)
        .to(camTargetPos, 2000)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onUpdate(() => controls.target.copy(targetPos))
        .onComplete(() => { navegando = false; })
        .start();

      new TWEEN.Tween(controls.target)
        .to(targetPos, 2000)
        .easing(TWEEN.Easing.Cubic.InOut)
        .start();

      document.getElementById('planet-title').innerText = data.nombre;
      actualizarMusica();
    }

    const audio = document.getElementById('musica');
    const audioSource = document.getElementById('audio-source');
    const btnAudio = document.getElementById('btn-audio');

    function actualizarMusica() {
      const data = sistemaSolarData[planetaActualIndex];
      if (data.audio) {
        audioSource.src = data.audio;
        audio.load();
        audio.play().catch(() => {});
        btnAudio.innerText = '⏸ Música';
      }
    }

    window.iniciarExperiencia = function() {
      document.getElementById('welcome-screen').style.display = 'none';
      sincronizarFirebase();
      videoElements3D.forEach(v => v.play().catch(() => {}));
      enfocarPlaneta(0);
    }

    btnAudio.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        btnAudio.innerText = '⏸ Música';
      } else {
        audio.pause();
        btnAudio.innerText = '🎵 Música';
      }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      const siguiente = (planetaActualIndex + 1) % sistemaSolarData.length;
      enfocarPlaneta(siguiente);
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let startX = 0, startY = 0;

    window.addEventListener('pointerdown', (e) => {
      startX = e.clientX; startY = e.clientY;
    });

    window.addEventListener('pointerup', async (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL' || navegando || document.getElementById('welcome-screen').style.display !== 'none') return;
      if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const obj = intersects[0].object;

        if (modoEliminar) {
          if (obj.userData.isPhoto || obj.userData.isVideo) {
            if (confirm("¿Deseas eliminar este elemento multimedia de la nube?")) {
              try {
                await deleteDoc(doc(db, "media", obj.userData.docId));
              } catch (err) {
                alert("No se pudo eliminar.");
              }
            }
          } else if (obj.userData.isWord) {
            if (confirm(`¿Deseas eliminar la palabra "${obj.userData.text}"?`)) {
              try {
                await deleteDoc(doc(db, "palabras", obj.userData.docId));
              } catch (err) {
                alert("No se pudo eliminar.");
              }
            }
          }
          btnDelete.click();
          return;
        }

        if (obj.userData.isBody) {
          enfocarPlaneta(obj.userData.index);
        } else if (obj.userData.isPhoto) {
          document.getElementById('modal-video').style.display = 'none';
          document.getElementById('modal-video').pause();
          const img = document.getElementById('modal-img');
          img.src = obj.userData.src;
          img.style.display = 'block';
          document.getElementById('modal').style.display = 'flex';
        } else if (obj.userData.isVideo) {
          document.getElementById('modal-img').style.display = 'none';
          const modalVideo = document.getElementById('modal-video');
          modalVideo.src = obj.userData.src;
          modalVideo.style.display = 'block';
          document.getElementById('modal').style.display = 'flex';
          modalVideo.play().catch(() => {});
        }
      }
    });

    function cerrarModal() {
      document.getElementById('modal').style.display = 'none';
      document.getElementById('modal-video').pause();
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);

      planetMeshes.forEach(group => group.children[0].rotation.y += 0.004);
      moonsList.forEach(m => m.pivot.rotation.y += m.speed);
      starField.rotation.y += 0.0002;

      mediaGroupsToOrient.forEach(group => {
        group.lookAt(camera.position);
      });

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
